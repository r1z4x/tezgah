name: release

# Runs when a release is published on GitHub.
# Publishes to npm and updates the brew formula sha256 in the tap repo.
#
# One-time setup (repo Settings → Secrets and variables → Actions):
#   NPM_TOKEN  : npm automation token from npmjs.com → Access Tokens
#   TAP_TOKEN  : GitHub Personal Access Token with repo scope on r1z4x/homebrew-tezgah
#
# Without these secrets the jobs skip cleanly.

on:
  release:
    types: [published]

# No job inherits a token it does not need (the audit's L-8): the workflow
# defaults to none, the npm job only reads the tree and mints the OIDC token
# `--provenance` signs with, and only the brew job, which uploads the release
# asset with GITHUB_TOKEN and signs the tarball's build provenance with an OIDC
# token, may write. Actions are pinned to a commit, with the
# tag they were resolved from beside it, so a moved tag cannot change what runs
# next to NPM_TOKEN and TAP_TOKEN.
permissions: {}

jobs:
  # CI on the release commit, run here rather than looked up: a lookup of a past
  # green run races CI, which is how v0.1.2 published while its CI went red.
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      release: true

  # The secrets context is not available in a job-level `if`, so a guard there
  # is a workflow-file parse failure and every event dies at 0s - the guards
  # live on the steps, where secrets read fine.
  npm-publish:
    needs: ci
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      # Nothing in this job pushes, so the checkout leaves no token behind in
      # .git/config for a later step to read.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - name: Publish (skipped without NPM_TOKEN)
        # the secrets context is unreadable in `if` at any level; the gate
        # reads the env mapping, which is the one place secrets surface.
        # Re-firing a release must not turn red on the version it already
        # published, so an exact-match live version counts as done.
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published"
            exit 0
          fi
          # `--tag latest` is explicit: newer npm refuses to move `latest` to a
          # version lower than one the registry already holds unless told to
          if OUT=$(npm publish --access public --provenance --tag latest 2>&1); then
            echo "$OUT" | tail -20
            exit 0
          fi
          echo "$OUT" | tail -20
          # npm accepts the tarball and then validates it, and a version still in
          # that pipeline refuses a second publish (E409 "previously staged
          # version"); it reaches the registry only when validation ends, so a
          # release fired again in that window used to leave this job red for a
          # version that was already on its way. Wait for the registry instead -
          # and stay red if it never arrives. Any other refusal (auth, network,
          # a rejected tarball) exits right here.
          case "$OUT" in
            *"previously staged version"*|*"previously published versions"*) ;;
            *) exit 1 ;;
          esac
          for i in $(seq 1 20); do
            sleep 30
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "$NAME@$VERSION went live while npm validated it"
              exit 0
            fi
          done
          echo "::error::$NAME@$VERSION is not live 10 minutes after npm accepted it - check https://www.npmjs.com/package/$NAME?activeTab=versions"
          exit 1

  brew-formula:
    needs: ci
    # `gh release upload` below writes the asset with GITHUB_TOKEN; id-token and
    # attestations sign and store the tarball's build provenance.
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      # The push below goes from a separate clone of the tap with TAP_TOKEN,
      # never from this checkout, so it keeps no GITHUB_TOKEN in .git/config.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build tarball and update tap formula (skipped without TAP_TOKEN)
        id: build
        if: ${{ env.TAP_TOKEN != '' }}
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          bash packaging/build.sh --version "$VERSION" --out /tmp/tz-rel
          SHA=$(shasum -a 256 /tmp/tz-rel/tezgah-"$VERSION".tar.gz | cut -d' ' -f1)

          # The asset the formula names goes up first, and both files are
          # checked on the release before the tap is touched: a formula pushed
          # ahead of its asset is a 404 for every `brew install` in between, and
          # for good when the upload then fails. The upload races the release
          # itself becoming readable, so it retries; a missing file ends the job
          # here, with the tap untouched.
          for i in 1 2 3 4 5 6; do
            if gh release upload "v${VERSION}" \
                 "/tmp/tz-rel/tezgah-${VERSION}.tar.gz" \
                 "/tmp/tz-rel/tezgah-${VERSION}.tar.gz.sha256" \
                 --repo "$GITHUB_REPOSITORY" --clobber; then
              break
            fi
            sleep 5
          done
          ASSETS=$(gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name')
          echo "$ASSETS" | grep -qx "tezgah-${VERSION}.tar.gz"
          echo "$ASSETS" | grep -qx "tezgah-${VERSION}.tar.gz.sha256"

          # the runner has no git identity; the tap commit needs one
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          # Clone the tap, update the formula, push
          git clone https://"$TAP_TOKEN"@github.com/r1z4x/homebrew-tezgah.git /tmp/tap
          cd /tmp/tap
          # The whole tree goes to libexec and bin gets a symlink into it:
          # tezgah-setup finds hooks/ through realpath(__file__), so a copy in
          # bin/ (the old bin.install) died on `import tezgah_apps`.
          # The caveats are for a 0.1.2 keg: it armed hooks with
          # Cellar/tezgah/0.1.2 paths, which this upgrade's cleanup deletes, and
          # a re-arm from opt/tezgah rewrites them (no backticks or $ in them:
          # this heredoc expands).
          cat > Formula/tezgah.rb <<RUBY
          class Tezgah < Formula
            desc "One shared working contract for every AI coding assistant you run"
            homepage "https://github.com/r1z4x/tezgah"
            url "https://github.com/r1z4x/tezgah/releases/download/v${VERSION}/tezgah-${VERSION}.tar.gz"
            sha256 "${SHA}"
            license "MIT"
            depends_on "python@3.10"

            def install
              libexec.install Dir["*"]
              bin.install_symlink libexec/"bin/tezgah-setup"
              bin.install_symlink libexec/"bin/tezgah-setup" => "tezgah"
            end

            def caveats
              <<~EOS
                Upgrading from 0.1.2: its hooks name the old Cellar/tezgah/0.1.2
                keg, which brew's cleanup deletes. Re-arm once so they name
                opt/tezgah instead:
                  tezgah update
                (it re-arms the hosts this install recorded), or
                  tezgah-setup --install --hosts <the hosts you armed>
              EOS
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/tezgah-setup --version")
            end
          end
          RUBY
          git add -A && git commit -m "tezgah ${VERSION}" && git push origin main
      # The brew twin of npm's --provenance: a signed SLSA statement binding the
      # tarball's digest to this repository, tag, workflow run and runner, so
      # "the digest matches the release page" extends to "the release page
      # matches the source". Check it with
      # `gh attestation verify tezgah-<version>.tar.gz --repo r1z4x/tezgah`.
      - name: Attest the tarball's build provenance
        if: ${{ steps.build.outcome == 'success' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: /tmp/tz-rel/tezgah-*.tar.gz
