name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile every script
        run: python3 -m compileall -q hooks hosts bin statusline.py
      - name: Run the stdlib test suite
        run: python3 -m unittest discover -s tests -v
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .
