# Lint configuration only. tezgah is a set of scripts and hooks run in place,
# not an installable package, so no [project] or build-system is declared.
[tool.ruff]
line-length = 100
target-version = "py38"
# The benchmark's fixtures (deliberately-broken code, and gold trees written
# against them) used to be excluded here; the instrument left this branch for
# `benchmarks/lab`, and its exclusions went with it.

# Keep the historical ruff core rules explicit: newer ruff releases ship a much
# broader default, and pinning the set keeps `ruff check .` stable in CI.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

# A pre-existing script written in a deliberately dense one-file style; its
# semicolons, multi-import line and lambdas are scoped here rather than in the
# file, which this change does not own.
[tool.ruff.lint.per-file-ignores]
"skills/plan-add/render_table.py" = ["E401", "E702", "E731"]
