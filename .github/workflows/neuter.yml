name: neuter

# Weekly, not per push: each mutant runs the gate's test modules in its own
# clone, so the matrix costs several suite runs. It answers a different question
# from ci.yml - not "do the tests pass" but "would they fail if a guard went".
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  neuter:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
      - name: Every anti-shortcut guard is load-bearing
        run: TEZGAH_E2E_STRICT=1 python3 tests/neuter_matrix.py
