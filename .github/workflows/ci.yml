name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile every script
        run: python3 -m compileall -q hooks hosts bin statusline.py
      - name: Run the stdlib test suite
        run: python3 -m unittest discover -s tests -v
      - name: Install ruff
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .

  apps-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Handshake only: no browser or device, so it stays deterministic.
      # TEZGAH_E2E_STRICT makes a server that cannot start a failure, not a skip.
      - name: App MCP handshake (playwright + mobile-mcp)
        run: TEZGAH_E2E_STRICT=1 python3 tests/e2e_analyze_wiring.py
