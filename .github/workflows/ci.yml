name: ci

on:
  push:
  pull_request:
  # release.yml runs this whole workflow as its `ci` job, so nothing publishes
  # before the same commit is green
  workflow_call:

# No job inherits a token it does not need: the workflow defaults to none and
# each job re-declares only what it reads.
permissions: {}

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      # one red leg must not cancel the others: the default cancelled 3.13 in
      # run 37228979769, so that leg's result was never known
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile every script
        run: python3 -m compileall -q hooks hosts bin statusline.py
      - name: Run the stdlib test suite
        run: python3 -m unittest discover -s tests -v
      - name: Install ruff
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Every docs citation lands in the symbol it names
        run: python3 bin/tezgah-docs --citations
      - name: The plan and decision rules, in a real project
        run: TEZGAH_E2E_STRICT=1 python3 tests/e2e_plan_flow.py

  # Shadow (plan 045, from 2026-10-05): the sharded suite on the floor and the
  # ceiling, with node for the plugin tests. It runs beside the `test` matrix for
  # four weeks; the matrix is cut only if this job missed no failure it caught.
  test-sharded:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      # 22: strips TypeScript types by default (22.18+), so the omp .ts hook in
      # test_omp_extension and the live omp probe load; 20 cannot.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Run the suite, sharded
        run: python3 tests/impacted.py --all

  apps-e2e:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
      # Handshake only: no browser or device, so it stays deterministic.
      # TEZGAH_E2E_STRICT makes a server that cannot start a failure, not a skip.
      - name: App MCP handshake (playwright + mobile-mcp)
        run: TEZGAH_E2E_STRICT=1 python3 tests/e2e_analyze_wiring.py

  artifact-install:
    # The release shape rather than the checkout: the tarball is built, unpacked
    # and installed from, so a path that only resolves in a git checkout (or a
    # tree entry the MANIFEST does not carry) fails here and nowhere else.
    # TEZGAH_DIST points upgrade.sh at the freshly built dist/ instead of a
    # published release, so no tag has to exist for CI to exercise the real
    # fetch-verify-unpack-flip code path; TEZGAH_NO_DEPS keeps the optional
    # tools' own installers off the network.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build the release artifact
        run: bash packaging/build.sh --version 0.0.0-test --out "$RUNNER_TEMP/dist"
      - name: Install from the built artifact
        env:
          TEZGAH_DIST: ${{ runner.temp }}/dist
          TEZGAH_NO_DEPS: "1"
        run: |
          bash packaging/install.sh --version 0.0.0-test --prefix "$RUNNER_TEMP/prefix"
          # The tree answers for itself, from the VERSION the build wrote: a build
          # that stops writing it, or a reader that stops reading it, would
          # otherwise answer plausibly with the CHANGELOG heading.
          got=$("$RUNNER_TEMP/prefix/current/bin/tezgah-setup" --version)
          [ "$got" = 0.0.0-test ] || {
            echo "the installed tree reports '$got', not the built 0.0.0-test"; exit 1; }
          "$RUNNER_TEMP/prefix/current/bin/tezgah-setup" --report
      - name: Install the unpacked artifact, end to end
        run: TEZGAH_E2E_STRICT=1 python3 tests/e2e_packaged_install.py

  artifact-install-windows:
    # The only place the Windows claim is proven: the same artifact install from
    # the native entry point on a real windows runner. `shell: bash` is Git Bash,
    # the shell the sh-based packaging scripts are written against, and install.ps1
    # is the twin a Windows user actually runs.
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      # Windows Python ships `python.exe` with no `python3`, and both build.sh and
      # the smoke probe PATH for `python3`; without this the smoke would take its
      # SKIP branch and the Windows claim would go unproven.
      - name: Put python3 on PATH
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec python "$@"\n' > "$HOME/.local/bin/python3"
          chmod +x "$HOME/.local/bin/python3"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the release artifact
        shell: bash
        run: bash packaging/build.sh --version 0.0.0-test --out "$RUNNER_TEMP/dist"
      - name: Install from the built artifact
        shell: pwsh
        env:
          TEZGAH_DIST: ${{ runner.temp }}\dist
          TEZGAH_NO_DEPS: "1"
        run: |
          pwsh -File packaging/install.ps1 -Version 0.0.0-test -Prefix "$env:RUNNER_TEMP\prefix"
          # The interpreter is named rather than the script executed: a host on
          # Windows starts through the resolver's `python3`/`py`, so the bare path
          # is not guaranteed to be executable here.
          $setup = "$env:RUNNER_TEMP\prefix\current\bin\tezgah-setup"
          $got = python $setup --version
          if ($got -ne '0.0.0-test') {
            throw "the installed tree reports '$got', not the built 0.0.0-test"
          }
          python $setup --report
      - name: Install the unpacked artifact, end to end
        shell: bash
        run: TEZGAH_E2E_STRICT=1 python3 tests/e2e_packaged_install.py
      - name: The opencode plugin's path rules, natively
        shell: bash
        working-directory: tests
        run: python -m unittest -v test_opencode_plugin.PluginPaths
      # The installed tree from install.ps1 above: `current` is a junction (or a
      # copy), so this is the one place `running_prefix()` and the uninstall's
      # link test meet the real thing.
      - name: Update, opencode live probe and uninstall from the installed tree
        shell: pwsh
        env:
          TEZGAH_NO_DEPS: "1"
        run: |
          $prefix = "$env:RUNNER_TEMP\prefix"
          $setup = "$prefix\current\bin\tezgah-setup"
          $out = python $setup update --dry-run | Out-String
          Write-Output $out
          if ($LASTEXITCODE) { throw "update --dry-run exited $LASTEXITCODE" }
          if ($out -notmatch [regex]::Escape("-> $prefix")) {
            throw "update did not resolve the install prefix $prefix"
          }
          if ($out -notmatch 'install\.ps1') { throw "update did not take the PowerShell path" }
          python $setup --install --hosts opencode --no-deps
          if ($LASTEXITCODE) { throw "--install --hosts opencode exited $LASTEXITCODE" }
          # TEZGAH_ROOTS is a drive path here: a `:` split made the plugin inert.
          # A live row reads UNVERIFIED, exit 0, when node is missing: that is no
          # proof, so it fails the step too.
          $live = python $setup --report --live --hosts opencode | Out-String
          Write-Output $live
          if ($LASTEXITCODE) { throw "--report --live --hosts opencode exited $LASTEXITCODE" }
          if ($live -match 'UNVERIFIED\s+live opencode') {
            throw "the opencode live probe did not run (UNVERIFIED above)"
          }
          python $setup --uninstall --hosts claude,codex,opencode,cursor,dsh,omp
          if ($LASTEXITCODE) { throw "--uninstall exited $LASTEXITCODE" }
          if (Test-Path -LiteralPath $prefix) {
            Get-ChildItem -Force -LiteralPath $prefix
            throw "--uninstall left $prefix behind"
          }
